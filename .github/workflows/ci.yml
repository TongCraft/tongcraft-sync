name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOD_VERSION: 0.1.${{ github.run_number }}

jobs:
  client:
    name: Build Minecraft client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build client mod
        run: ./gradlew --no-daemon :client:build -PmodVersion="$MOD_VERSION"
      - name: Upload client JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tongcraft-sync-client
          path: client/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  service:
    name: Test independent sync service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: service/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run service tests
        run: npm test
      - name: Check runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Build service container
        run: docker build --tag tongcraft-sync-ci .
      - name: Smoke test container
        shell: bash
        run: |
          container=$(docker run --detach --publish 127.0.0.1:18787:8787 --env TONGCRAFT_ADMIN_UUID=00000000000040008000000000000001 tongcraft-sync-ci)
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 3 http://127.0.0.1:18787/health

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [client, service]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tongcraft-sync-client
          path: release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.jar > SHA256SUMS.txt
      - name: Create tag and publish JARs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="v$MOD_VERSION"
          cat > release-notes.md <<EOF
          适用于 Minecraft Java 26.2 的 TongCraft Sync 自动构建。

          安装时下载不带 “-sources” 后缀的 JAR，放入客户端 mods 目录。
          需要 Fabric Loader、Fabric API、Litematica 和 MaLiLib；游戏服务器无需安装。
          源码 JAR 供开发使用，SHA256SUMS.txt 用于校验下载文件。

          版本：$MOD_VERSION
          对应提交：$COMMIT
          客户端构建、服务端测试和容器启动检查均已通过。
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            target=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
            test "$target" = "$COMMIT"
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --target "$COMMIT" \
              --title "TongCraft Sync $tag（Minecraft 26.2）" \
              --notes-file release-notes.md --generate-notes
          fi
