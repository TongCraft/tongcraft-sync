name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Build Minecraft client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build client mod
        run: ./gradlew --no-daemon :client:build
      - name: Upload client JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tongcraft-sync-client
          path: client/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  service:
    name: Test independent sync service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: service/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run service tests
        run: npm test
      - name: Check runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Build service container
        run: docker build --tag tongcraft-sync-ci .
      - name: Smoke test container
        shell: bash
        run: |
          container=$(docker run --detach --publish 127.0.0.1:18787:8787 --env TONGCRAFT_ADMIN_UUID=00000000000040008000000000000001 tongcraft-sync-ci)
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18787/health
